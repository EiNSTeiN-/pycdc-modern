name: Generator Expanded Calls

on:
  pull_request:
  push:
    branches: [fix/generator-expanded-call-slot]

permissions:
  contents: read

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo build --locked
      - run: python tests/test_generator_expanded_calls.py
