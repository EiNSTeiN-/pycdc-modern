name: Python 3.14 behavior regressions
on:
  push:
    branches: [main, python-314-recovery]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - run: cargo build --locked --bin pycdc
      - run: python -B tests/python314_roundtrip.py -v
